[project]
name = "eod-reapply"
version = "0.1.0"
description = "EOD campaign sender-tag reapply tool"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "hypothesis>=6.0",
    "mypy>=1.8",
    "ruff>=0.5",
]

[project.scripts]
eod-reapply = "eod_reapply.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Default rules (E, F, W) plus a few extras that catch real bugs
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E501",  # line length — we have line-length set; ruff still flags some long strings
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",                                    # treat warnings as errors by default
    "ignore::DeprecationWarning:_pytest.*",     # don't fail on pytest's own deprecation warnings
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
