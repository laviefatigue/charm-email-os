name: eod-reapply

# Scoped CI for the apps/eod-reapply/ subdir only — runs on changes to that
# tree or to this workflow file. Keeps the broader repo's eventual CI separate.
on:
  push:
    branches: [master]
    paths:
      - "apps/eod-reapply/**"
      - ".github/workflows/eod-reapply.yml"
  pull_request:
    paths:
      - "apps/eod-reapply/**"
      - ".github/workflows/eod-reapply.yml"

concurrency:
  group: eod-reapply-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/eod-reapply
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: ruff (lint)
        run: ruff check src tests

      - name: mypy --strict (typecheck)
        run: mypy --strict src/eod_reapply

      - name: pytest (strict mode + coverage)
        run: |
          pytest --strict-markers --strict-config \
                 --cov=src/eod_reapply \
                 --cov-report=term-missing \
                 --cov-fail-under=95

  docker:
    name: docker build
    runs-on: ubuntu-latest
    # Only build on PR/push that touches Dockerfile or src/ — saves CI minutes
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: apps/eod-reapply
          file: apps/eod-reapply/Dockerfile
          push: false
          load: true
          tags: eod-reapply:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          # Image should --help cleanly and show both subcommands
          docker run --rm eod-reapply:ci-${{ github.sha }} --help | grep -q "reapply"
          docker run --rm eod-reapply:ci-${{ github.sha }} --help | grep -q "check"
          docker run --rm eod-reapply:ci-${{ github.sha }} check --help | grep -q "workspace"
          docker run --rm eod-reapply:ci-${{ github.sha }} reapply --help | grep -q "campaign-id"
