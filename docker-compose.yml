# Charm Email OS - Docker Compose Configuration
# Connects Next.js frontend to FastAPI backend with OwnRBL PostgreSQL

version: '3.8'

services:
  # =============================================================
  # FRONTEND: Next.js Application
  # =============================================================
  charm-frontend:
    build:
      context: ./charm-email-os
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: charm-frontend
    env_file:
      - .env.local
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      charm-api:
        condition: service_healthy
    networks:
      - charm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================
  # EXECUTIVE DASHBOARD: Charm-specific health dashboard
  # =============================================================
  executive-dashboard:
    build:
      context: ./executive-dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://charm-api:8000
    container_name: executive-dashboard
    ports:
      - "${EXEC_DASHBOARD_PORT:-3006}:3006"
    environment:
      - NODE_ENV=production
      - API_URL=http://charm-api:8000
      - NEXT_PUBLIC_API_URL=http://charm-api:8000
    depends_on:
      charm-api:
        condition: service_healthy
    networks:
      - charm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================
  # BACKEND: FastAPI Application
  # =============================================================
  charm-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: charm-api
    env_file:
      - .env.local
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database Configuration (OwnRBL PostgreSQL)
      - POSTGRES_HOST=${POSTGRES_HOST:-host.docker.internal}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA:-public}
      # Email Bison API
      - EMAILBISON_API_KEY=${EMAILBISON_API_KEY:-}
      - EMAILBISON_API_URL=${EMAILBISON_API_URL:-https://spellcast.hirecharm.com/api}
      # Domain Registrar APIs
      - DYNADOT_API_KEY=${DYNADOT_API_KEY:-}
      - PORKBUN_API_KEY=${PORKBUN_API_KEY:-}
      - PORKBUN_API_SECRET=${PORKBUN_API_SECRET:-}
      # API Configuration
      - API_TITLE=Charm Email OS API
      - API_VERSION=1.0.0
      - DEBUG=${DEBUG:-false}
      # CORS - allow frontend origins
      - CORS_ORIGINS=["http://localhost:3000","http://charm-frontend:3000","http://localhost:3006","http://executive-dashboard:3006","${FRONTEND_URL:-http://localhost:3000}"]
    networks:
      - charm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  charm-network:
    driver: bridge
    name: charm-network

# =============================================================
# USAGE NOTES
# =============================================================
#
# Development (with local PostgreSQL):
#   docker-compose up -d
#
# Production (with external OwnRBL PostgreSQL):
#   POSTGRES_HOST=31.97.142.123 POSTGRES_PASSWORD=<password> docker-compose up -d
#
# Environment Variables:
#   - POSTGRES_HOST: OwnRBL PostgreSQL host (default: host.docker.internal for local dev)
#   - POSTGRES_PORT: PostgreSQL port (default: 5432)
#   - POSTGRES_DB: Database name (default: postgres)
#   - POSTGRES_USER: Database user (default: postgres)
#   - POSTGRES_PASSWORD: Database password (REQUIRED)
#   - POSTGRES_SCHEMA: Schema to use (default: public)
#   - EMAILBISON_API_KEY: EmailBison API key for sync
#   - DYNADOT_API_KEY: Dynadot API key for domain purchases
#   - PORKBUN_API_KEY: Porkbun API key for domain purchases
#   - PORKBUN_API_SECRET: Porkbun API secret
#   - FRONTEND_PORT: Frontend exposed port (default: 3000)
#   - EXEC_DASHBOARD_PORT: Executive dashboard port (default: 3006)
#   - API_PORT: API exposed port (default: 8000)
#   - FRONTEND_URL: Production frontend URL for CORS
#   - DEBUG: Enable debug mode (default: false)
#
# Coolify Deployment:
#   Use Coolify's docker-compose deployment with environment variables
#   configured in the Coolify dashboard. Set POSTGRES_HOST to the
#   OwnRBL server IP (31.97.142.123).
