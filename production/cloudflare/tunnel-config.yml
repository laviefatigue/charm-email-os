# Cloudflare Tunnel Configuration
# Location: /etc/cloudflared/config.yml on VPS
#
# This file routes Cloudflare subdomains to Coolify services.
# The httpHostHeader maps to Coolify's internal sslip.io domains.

tunnel: 3622b036-2569-45b8-a787-ac4862098d52
credentials-file: /etc/cloudflared/3622b036-2569-45b8-a787-ac4862098d52.json

ingress:
  # Frontend (Next.js app)
  - hostname: app.wizardgrimoire.cloud
    service: http://localhost:80
    originRequest:
      httpHostHeader: qw88skgwgwgk8g44c0g4wgks.187.77.19.81.sslip.io

  # API (FastAPI)
  - hostname: api.wizardgrimoire.cloud
    service: http://localhost:80
    originRequest:
      httpHostHeader: nckgggwww8sggg0kc4wo00o8.187.77.19.81.sslip.io

  # Executive Dashboard
  - hostname: dashboard.wizardgrimoire.cloud
    service: http://localhost:80
    originRequest:
      httpHostHeader: gkkgsscwck0o80gwkcsogcow.187.77.19.81.sslip.io

  # Coolify Panel (direct to port 8000)
  - hostname: coolify.wizardgrimoire.cloud
    service: http://localhost:8000

  # Catch-all (return 404)
  - service: http_status:404

# Notes:
# - The sslip.io hostnames are generated by Coolify for each service
# - Find these in Coolify UI under each application's "Domains" tab
# - Port 80 is Coolify's proxy that routes based on Host header
# - Port 8000 is Coolify's management UI itself
