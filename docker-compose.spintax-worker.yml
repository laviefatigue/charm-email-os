# Charm Email OS - Spintax Worker (Persistent Daemon)
#
# This compose file deploys the spintax worker as a persistent daemon
# that polls for pending spintax processing jobs.
#
# For Coolify deployment:
# - Create new application with docker-compose
# - Set environment variables in Coolify UI
# - Deploy - container will keep running
#
# Authentication Setup (see docs/claude-docker-auth.md for full guide):
#   Option 1: Long-lived token (RECOMMENDED - never expires)
#     docker exec -it charm-spintax-worker bash
#     claude setup-token
#     # Save the token to .credentials.json (see docs)
#
#   Option 2: OAuth (expires ~30 days)
#     docker exec -it charm-spintax-worker bash
#     claude /login
#     # Follow browser OAuth flow, then exit
#
# For local testing:
#   docker compose -f docker-compose.spintax-worker.yml up -d

services:
  spintax-worker:
    build:
      context: .
      dockerfile: Dockerfile.spintax-worker
    image: charm-spintax-worker:latest
    container_name: charm-spintax-worker
    restart: unless-stopped
    environment:
      # Database connection (set these in Coolify)
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Worker configuration
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - CLAUDE_ACCOUNT=${CLAUDE_ACCOUNT:-}
      # OAuth health monitoring
      - OAUTH_CHECK_INTERVAL=${OAUTH_CHECK_INTERVAL:-3600}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      # API Key auth (alternative to OAuth - never expires)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      # Persist OAuth credentials between container restarts
      # Using named volume for better portability and sharing between workers
      - charm-claude-credentials:/home/claude/.claude
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python3.*spintax_worker.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  charm-claude-credentials:
    external: true
    # Use the same named volume as strategy-worker and domain-worker
    # This shares OAuth credentials across all workers

# Note: No ports exposed - this is a background worker, not a web service
