# Hypertide Purchase Flow Map
# Complete UI element mapping for browser automation
# Last Updated: 2025-12-10
# Source: Live platform exploration

flow:
  name: "Hypertide Purchase Flow"
  base_url: "https://app2.hypertide.io"
  steps: 4
  progress_indicator: "Choose Plan → Select Domains → Setup Domain Settings → Review Order"

# =============================================================================
# STEP 1: CHOOSE PLAN
# =============================================================================
step_1_choose_plan:
  url: "/choose-plan"
  purpose: "Select inbox type (Entra vs Google) and quantity"

  navigation:
    from_dashboard:
      element: "Place New Order"
      selector: "text=Place New Order"

  plan_cards:
