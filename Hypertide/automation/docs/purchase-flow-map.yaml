          - value: "1 order - 2 Entra Domains, 5k emails/mo"
            orders: 1
            domains: 2
            inboxes: 100
            capacity: 5000
          - value: "2 orders - 4 Entra Domains, 10k emails/mo"
            orders: 2
            domains: 4
            inboxes: 200
            capacity: 10000
          - value: "3 orders - 6 Entra Domains, 15k emails/mo"
            orders: 3
            domains: 6
            inboxes: 300
            capacity: 15000
          - value: "4 orders - 8 Entra Domains, 20k emails/mo"
            orders: 4
            domains: 8
            inboxes: 400
            capacity: 20000
          - value: "5 orders - 10 Entra Domains, 25k emails/mo"
            orders: 5
            domains: 10
            inboxes: 500
            capacity: 25000
          - value: "6 orders - 12 Entra Domains, 30k emails/mo"
            orders: 6
            domains: 12
            inboxes: 600
            capacity: 30000
          - value: "7 orders - 14 Entra Domains, 35k emails/mo"
            orders: 7
            domains: 14
            inboxes: 700
            capacity: 35000
          - value: "8 orders - 16 Entra Domains, 40k emails/mo"
            orders: 8
            domains: 16
            inboxes: 800
            capacity: 40000
          - value: "9 orders - 18 Entra Domains, 45k emails/mo"
            orders: 9
            domains: 18
            inboxes: 900
            capacity: 45000
          - value: "10 orders - 20 Entra Domains, 50k emails/mo"
            orders: 10
            domains: 20
            inboxes: 1000
            capacity: 50000
          - value: "15 orders - 30 Entra Domains, 75k emails/mo"
            orders: 15
            domains: 30
            inboxes: 1500
            capacity: 75000
          - value: "20 orders - 40 Entra Domains, 100k emails/mo"
            orders: 20
            domains: 40
            inboxes: 2000
            capacity: 100000

      select_button:
        text: "Select Plan - $50/mo"
        selector: "button:has-text('Select Plan'):near(:text('Hypertide Entra'))"

      specs:
        domains_per_order: 2
        inboxes_per_domain: 50
