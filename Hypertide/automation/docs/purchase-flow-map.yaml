          other: "$9.00"

    google:
      heading: "Hypertide Google"
      recommended: false
      tagline: "Perfect for reaching out to personal emails with high deliverability rates"
      base_price: "$50/month"
      selector: "text=Hypertide Google"

      quantity_dropdown:
        selector: "combobox[value*='Google']"
        options:
          - value: "1 order - 5 Google Domains, 5k+ emails/mo"
            orders: 1
            domains: 5
            inboxes: 15
            capacity: 5000
          - value: "2 orders - 10 Google Domains, 10k+ emails/mo"
            orders: 2
            domains: 10
            inboxes: 30
            capacity: 10000
          - value: "3 orders - 15 Google Domains, 15k+ emails/mo"
            orders: 3
            domains: 15
